<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0b0d13" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Substrate Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6025e6"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <!-- Orbital Fields Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#6025e6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Purple Glow -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="220" stroke="#1d2433" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="190" stroke="#18202c" stroke-width="1"/>

  <!-- Field Coupling Orbit 1 (Horizontal Ellipse) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(-30 256 256)" filter="url(#glowCyan)"/>
  
  <!-- Field Coupling Orbit 2 (Vertical Ellipse) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(45 256 256)" filter="url(#glowPurple)"/>

  <!-- Concentric Substrate Boundary Rings -->
  <circle cx="256" cy="256" r="120" stroke="#251b45" stroke-width="2"/>
  <circle cx="256" cy="256" r="95" stroke="url(#coreGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="5 15"/>
  <circle cx="256" cy="256" r="70" stroke="#1b2e45" stroke-width="2"/>

  <!-- Core Stable Substrate (Central Entity) -->
  <circle cx="256" cy="256" r="40" fill="url(#coreGrad)" filter="url(#glowCyan)"/>
  
  <!-- Substrate Core Inner Detail -->
  <circle cx="256" cy="256" r="18" fill="#0b0d13"/>
  <circle cx="256" cy="256" r="6" fill="#00f2fe"/>

  <!-- Grounding Nodes (Interconnected topological points) -->
  <!-- Top Node -->
  <circle cx="256" cy="66" r="5" fill="#00f2fe" filter="url(#glowCyan)"/>
  <line x1="256" y1="71" x2="256" y2="136" stroke="#00f2fe" stroke-dasharray="2 4" stroke-opacity="0.6"/>

  <!-- Bottom Node -->
  <circle cx="256" cy="446" r="5" fill="#9d4edd" filter="url(#glowPurple)"/>
  <line x1="256" y1="441" x2="256" y2="376" stroke="#9d4edd" stroke-dasharray="2 4" stroke-opacity="0.6"/>

  <!-- Left Node -->
  <circle cx="96" cy="256" r="4" fill="#00f2fe" opacity="0.8"/>
  
  <!-- Right Node -->
  <circle cx="416" cy="256" r="4" fill="#9d4edd" opacity="0.8"/>

  <!-- Intersecting Network Lines (Topological connection paths) -->
  <path d="M 120 178 L 256 256" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 392 178 L 256 256" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 120 334 L 256 256" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 392 334 L 256 256" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Floating Active Nodes (Epistemic explorer points) -->
  <circle cx="178" cy="211" r="3" fill="#00f2fe"/>
  <circle cx="334" cy="301" r="3" fill="#9d4edd"/>
  <circle cx="290" cy="150" r="2.5" fill="#00f2fe" opacity="0.7"/>
  <circle cx="220" cy="362" r="2.5" fill="#9d4edd" opacity="0.7"/>
</svg>
